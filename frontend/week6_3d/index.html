<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>智能会议室 3D 联动演示</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family:
                "Microsoft YaHei",
                system-ui,
                sans-serif;

            background: #0f172a;
            color: #e5e7eb;
        }

        #app {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #scene {
            width: 100%;
            height: 100%;
            display: block;
        }

        .panel {
            position: absolute;

            top: 18px;
            left: 18px;

            width: 320px;

            background:
                rgba(
                    15,
                    23,
                    42,
                    0.88
                );

            border:
                1px solid
                rgba(
                    148,
                    163,
                    184,
                    0.25
                );

            border-radius: 16px;

            padding: 18px;

            backdrop-filter:
                blur(12px);

            box-shadow:
                0 16px 40px
                rgba(
                    0,
                    0,
                    0,
                    0.28
                );
        }

        .panel h1 {
            margin:
                0 0 12px;

            font-size: 20px;
        }

        .panel p {
            margin:
                6px 0;

            color:
                #cbd5e1;

            font-size:
                13px;

            line-height:
                1.6;
        }

        .status-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin:
                14px 0;
        }

        .status-card {
            background:
                rgba(
                    30,
                    41,
                    59,
                    0.9
                );

            border-radius:
                12px;

            padding:
                12px;

            border:
                1px solid
                rgba(
                    148,
                    163,
                    184,
                    0.18
                );
        }

        .status-card .label {
            font-size:
                12px;

            color:
                #94a3b8;

            margin-bottom:
                6px;
        }

        .status-card .value {
            font-size:
                16px;

            font-weight:
                700;
        }

        .ok {
            color:
                #86efac;
        }

        .off {
            color:
                #cbd5e1;
        }

        .warn {
            color:
                #fca5a5;
        }

        .controls {
            display:
                flex;

            gap:
                10px;

            flex-wrap:
                wrap;

            margin-top:
                14px;
        }

        button {
            border:
                0;

            border-radius:
                10px;

            padding:
                10px 14px;

            cursor:
                pointer;

            font-weight:
                700;

            font-size:
                13px;
        }

        button:disabled {
            cursor:
                not-allowed;

            opacity:
                0.65;
        }

        #recognizeBtn {
            background:
                #2563eb;

            color:
                white;
        }

        #resetBtn {
            background:
                #334155;

            color:
                #e2e8f0;
        }

        .hint {
            position:
                absolute;

            right:
                18px;

            bottom:
                18px;

            background:
                rgba(
                    15,
                    23,
                    42,
                    0.78
                );

            border:
                1px solid
                rgba(
                    148,
                    163,
                    184,
                    0.22
                );

            border-radius:
                12px;

            padding:
                10px 14px;

            font-size:
                12px;

            color:
                #cbd5e1;

            backdrop-filter:
                blur(10px);
        }
    </style>


    <!--
        Three.js 模块映射
    -->
    <script type="importmap">
    {
        "imports": {
            "three":
                "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

            "three/addons/":
                "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>

</head>


<body>

<div id="app">

    <canvas id="scene"></canvas>


    <section class="panel">

        <h1>
            智能会议室 3D 联动
        </h1>


        <p>
            点击“开始人脸识别”，
            系统将自动打开摄像头。
            身份验证成功后，
            会议室自动开门、
            开灯并启动空调。
        </p>


        <div class="status-grid">

            <div class="status-card">

                <div class="label">
                    人员状态
                </div>

                <div
                    id="personStatus"
                    class="value warn"
                >
                    未识别
                </div>

            </div>


            <div class="status-card">

                <div class="label">
                    门状态
                </div>

                <div
                    id="doorStatus"
                    class="value off"
                >
                    关闭
                </div>

            </div>


            <div class="status-card">

                <div class="label">
                    灯光状态
                </div>

                <div
                    id="lightStatus"
                    class="value off"
                >
                    关闭
                </div>

            </div>


            <div class="status-card">

                <div class="label">
                    空调状态
                </div>

                <div
                    id="acStatus"
                    class="value off"
                >
                    关闭
                </div>

            </div>

        </div>


        <div class="controls">

            <button
                id="recognizeBtn"
                type="button"
            >
                开始人脸识别
            </button>


            <button
                id="resetBtn"
                type="button"
            >
                重置
            </button>

        </div>

    </section>


    <div class="hint">

        鼠标左键旋转 ·
        滚轮缩放 ·
        右键平移

    </div>

</div>


<script
    type="module"
    src="./js/scene.js"
></script>

</body>

</html>
