<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>智能会议室 III</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: #111715;
      color: #ffffff;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #scene-container {
      width: 100%;
      height: 100%;
    }

    #scene {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 左侧状态栏 */
    .panel {
      position: absolute;
      top: 20px;
      left: 20px;

      width: 280px;

      padding: 20px;

      background: rgba(20, 28, 25, 0.90);

      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;

      backdrop-filter: blur(10px);

      z-index: 10;
    }

    .panel h1 {
      font-size: 21px;
      margin-bottom: 6px;
    }

    .room-name {
      font-size: 13px;
      color: #aab8b1;
      margin-bottom: 20px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .status-item {
      padding: 12px;

      background: rgba(255, 255, 255, 0.06);

      border-radius: 10px;
    }

    .status-label {
      font-size: 12px;
      color: #9ca9a3;
      margin-bottom: 5px;
    }

    .status-value {
      font-size: 18px;
      font-weight: bold;
    }

    .device-section {
      margin-top: 16px;
    }

    .device-row {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 10px 0;

      border-bottom: 1px solid rgba(255, 255, 255, 0.08);

      font-size: 14px;
    }

    .device-state {
      color: #b9c7c0;
    }

    /* 右上角按钮 */
    .controls {
      position: absolute;

      top: 20px;
      right: 20px;

      display: flex;
      flex-direction: column;
      gap: 8px;

      z-index: 10;
    }

    button {
      border: none;
      border-radius: 8px;

      padding: 10px 15px;

      cursor: pointer;

      color: #ffffff;

      background: rgba(24, 36, 31, 0.92);

      border: 1px solid rgba(255, 255, 255, 0.15);

      font-size: 13px;
    }

    button:hover {
      background: rgba(55, 82, 70, 0.95);
    }

    /* 加载提示 */
    #loading {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      padding: 16px 24px;

      background: rgba(0, 0, 0, 0.75);

      border-radius: 10px;

      font-size: 14px;

      z-index: 20;
    }

    /* 底部提示 */
    #message {
      position: absolute;

      bottom: 20px;
      left: 50%;

      transform: translateX(-50%);

      padding: 9px 16px;

      background: rgba(20, 28, 25, 0.85);

      border-radius: 8px;

      font-size: 12px;

      color: #cbd6d0;

      z-index: 10;
    }

    /* 窄屏适配 */
    @media (max-width: 800px) {
      .panel {
        width: 230px;
        top: 10px;
        left: 10px;
        padding: 14px;
      }

      .panel h1 {
        font-size: 17px;
      }

      .status-value {
        font-size: 15px;
      }

      .controls {
        top: 10px;
        right: 10px;
      }

      button {
        padding: 8px 10px;
      }
    }
  </style>

  <!-- Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<div id="app">

  <div id="scene-container">
    <canvas id="scene"></canvas>
  </div>


  <!-- 左侧实时状态 -->
  <aside class="panel">

    <h1>智能会议室 III</h1>

    <div class="room-name">
      R01 · 会议室实时状态
    </div>


    <div class="status-grid">

      <div class="status-item">
        <div class="status-label">
          温度
        </div>

        <div
          class="status-value"
          id="temperature"
        >
          -- ℃
        </div>
      </div>


      <div class="status-item">
        <div class="status-label">
          湿度
        </div>

        <div
          class="status-value"
          id="humidity"
        >
          -- %
        </div>
      </div>


      <div class="status-item">
        <div class="status-label">
          光照强度
        </div>

        <div
          class="status-value"
          id="lightIntensity"
        >
          -- %
        </div>
      </div>


      <div class="status-item">
        <div class="status-label">
          数据状态
        </div>

        <div
          class="status-value"
          id="dataStatus"
        >
          未连接
        </div>
      </div>

    </div>


    <div class="device-section">

      <div class="device-row">

        <span>
          会议室门
        </span>

        <span
          class="device-state"
          id="doorStatus"
        >
          关闭
        </span>

      </div>


      <div class="device-row">

        <span>
          空调
        </span>

        <span
          class="device-state"
          id="acStatus"
        >
          关闭
        </span>

      </div>


      <div class="device-row">

        <span>
          室内灯光
        </span>

        <span
          class="device-state"
          id="lightStatus"
        >
          等待数据
        </span>

      </div>

    </div>

  </aside>


  <!-- 右侧视角和测试按钮 -->
  <div class="controls">

    <button id="overviewBtn">
      总览视角
    </button>

    <button id="topBtn">
      俯视视角
    </button>

    <button id="insideBtn">
      室内视角
    </button>

    <button id="openDoorBtn">
      测试开门
    </button>

    <button id="closeDoorBtn">
      测试关门
    </button>

  </div>


  <div id="loading">
    正在加载会议室模型...
  </div>


  <div id="message">
    鼠标左键旋转 · 滚轮缩放 · 右键平移
  </div>

</div>


<script
  type="module"
  src="./js/scene.js"
></script>

</body>
</html>
